<div
  aria-live="polite"
  class="pointer-events-none fixed inset-x-2 bottom-2 z-40 flex flex-col gap-2 sm:left-auto sm:right-4 sm:w-96"
>
  @for (notification of notifications(); track notification.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 rounded-lg border border-bordure bg-surface p-3 shadow-lg"
    >
      <app-badge [libelle]="notification.titre" [tonalite]="notification.tonalite" />

      <div class="min-w-0 flex-1">
        @if (notification.message) {
          <p class="text-sm text-texte">{{ notification.message }}</p>
        }
      </div>

      <button
        type="button"
        class="flex size-(--cible-tactile) shrink-0 items-center justify-center rounded-md text-texte-discret transition-colors duration-(--duree-rapide) hover:bg-surface-creuse hover:text-texte"
        [attr.aria-label]="'Fermer la notification : ' + notification.titre"
        (click)="rejet.emit(notification.id)"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
  }
</div>
