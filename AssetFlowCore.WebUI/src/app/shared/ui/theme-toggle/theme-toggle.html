<fieldset class="flex items-center gap-1 rounded-lg border border-bordure p-0.5">
  <legend class="sr-only">Thème de l'interface</legend>

  @for (option of options; track option.valeur) {
    <label
      class="cursor-pointer rounded-md px-2.5 py-1.5 text-sm text-texte-discret transition-colors duration-(--duree-rapide) has-checked:bg-primaire has-checked:text-texte-inverse has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-focus"
    >
      <input
        type="radio"
        class="sr-only"
        [name]="nomGroupe"
        [value]="option.valeur"
        [checked]="theme() === option.valeur"
        (change)="themeChange.emit(option.valeur)"
      />
      {{ option.libelle }}
    </label>
  }
</fieldset>
