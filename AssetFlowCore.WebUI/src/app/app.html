<a
  href="#contenu"
  class="sr-only focus-visible:not-sr-only focus-visible:absolute focus-visible:top-2 focus-visible:left-2 focus-visible:z-50 focus-visible:rounded-md focus-visible:bg-surface focus-visible:px-3 focus-visible:py-2 focus-visible:text-texte focus-visible:shadow-lg"
>
  Aller au contenu
</a>

<header class="border-b border-bordure bg-surface">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-3 px-4 py-3">
    <p class="text-lg font-semibold tracking-tight">{{ nomProduit }}</p>
    <span class="text-sm text-texte-discret" i18n="@@app.sousTitre"
      >Gestion du parc informatique</span
    >

    <nav
      aria-label="Navigation principale"
      i18n-aria-label="@@app.nav.ariaLabel"
      class="flex flex-wrap items-center gap-1 text-sm"
    >
      <a
        routerLink="/assets"
        routerLinkActive="bg-surface-creuse font-medium"
        class="flex min-h-(--cible-tactile) items-center rounded-md px-2.5 text-primaire underline underline-offset-2"
        i18n="@@app.nav.assets"
      >
        Actifs
      </a>
      <a
        routerLink="/tickets"
        routerLinkActive="bg-surface-creuse font-medium"
        class="flex min-h-(--cible-tactile) items-center rounded-md px-2.5 text-primaire underline underline-offset-2"
        i18n="@@app.nav.tickets"
      >
        Incidents
      </a>
      <a
        routerLink="/teams"
        routerLinkActive="bg-surface-creuse font-medium"
        class="flex min-h-(--cible-tactile) items-center rounded-md px-2.5 text-primaire underline underline-offset-2"
        i18n="@@app.nav.teams"
      >
        Équipes
      </a>
    </nav>

    <app-theme-toggle
      class="ms-auto"
      [theme]="themePrefere()"
      (themeChange)="changerTheme($event)"
    />
  </div>
</header>

<main id="contenu" class="mx-auto max-w-6xl px-4 py-6">
  <router-outlet />
</main>
