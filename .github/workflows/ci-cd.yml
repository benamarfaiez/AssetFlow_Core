# =============================================================================
# AssetFlowCore — Pipeline CI/CD GitHub Actions
# =============================================================================
# Déclencheurs :
#   - Push sur les branches main et dev
#   - Pull Request ciblant main ou dev
#
# Jobs :
#   1. build            → Compilation Release + vérification du format
#   2. test-unit        → Tests unitaires + couverture de code (dépend : build)
#   3. test-integration → Tests d'intégration (dépend : build)
#   4. benchmark        → Exécution des benchmarks BenchmarkDotNet (dépend : build)
#   5. quality          → Analyse SonarCloud (dépend : test-unit, test-integration)
#   6. deploy           → Déploiement Docker conditionnel sur main (dépend : quality)
# =============================================================================

name: AssetFlowCore CI/CD

# -----------------------------------------------------------------------------
# Déclencheurs du pipeline
# -----------------------------------------------------------------------------
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

# -----------------------------------------------------------------------------
# Variables d'environnement globales partagées par tous les jobs
# -----------------------------------------------------------------------------
env:
  DOTNET_VERSION: "8.0"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_FILE: "AssetFlowCore.slnx"
  BUILD_CONFIGURATION: "Release"
  DOCKER_IMAGE_NAME: "assetflow-api"

# =============================================================================
# JOB 1 — BUILD
# Restaure les dépendances NuGet, compile la solution en Release
# et vérifie que le code respecte les règles de formatage .NET
# =============================================================================
jobs:
  build:
    name: Build & Format Check
    runs-on: ubuntu-latest

    steps:
      # Récupération du code source
      - name: Checkout du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historique complet requis pour SonarCloud

      # Installation du SDK .NET 8
      - name: Installation du SDK .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Mise en cache des packages NuGet pour accélérer les runs suivants
      - name: Mise en cache des packages NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Restauration de toutes les dépendances NuGet
      - name: Restauration des dépendances NuGet
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # Compilation de la solution en mode Release
      # --no-restore : évite une double restauration
      - name: Compilation en mode Release
        run: |
          dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      # Vérification du format du code sans modification
      # Échoue si le code n'est pas formaté correctement
      - name: Vérification du format du code (dotnet format)
        run: |
          dotnet format ${{ env.SOLUTION_FILE }} \
            --verify-no-changes \
            --no-restore \
            --severity warn
        continue-on-error: false

      # Publication des artefacts de build pour les jobs suivants
      # Évite de recompiler dans chaque job
      - name: Publication des artefacts de build
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/bin/Release/
            **/obj/Release/
          retention-days: 1

  # ===========================================================================
  # JOB 2 — TESTS UNITAIRES
  # Exécute les tests unitaires avec collecte de couverture de code (Cobertura)
  # ===========================================================================
  test-unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: build  # Attend la réussite du build

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Installation du SDK .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Mise en cache des packages NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restauration des dépendances NuGet
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # Exécution des tests unitaires avec :
      # - Collecte de couverture via coverlet (format Cobertura pour SonarCloud)
      # - Rapport TRX pour l'affichage dans GitHub Actions
      # - Exclusion des projets non pertinents pour la couverture
      - name: Exécution des tests unitaires avec couverture
        run: |
          dotnet test AssetFlowCore.UnitTests/AssetFlowCore.UnitTests.csproj \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-restore \
            --logger "trx;LogFileName=unit-tests-results.trx" \
            --results-directory ./TestResults/Unit \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura \
               DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[*.Tests]*,[*.IntegrationTests]*,[*.Benchmarks]*" \
               DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[AssetFlowCore.Domain]*,[AssetFlowCore.Application]*,[AssetFlowCore.Infrastructure]*"

      # Publication du rapport de couverture en HTML (optionnel, pour revue PR)
      - name: Génération du rapport de couverture HTML
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: "./TestResults/Unit/**/coverage.cobertura.xml"
          targetdir: "./TestResults/Unit/CoverageReport"
          reporttypes: "HtmlInline;Cobertura;Badges"
          verbosity: "Warning"

      # Téléversement des résultats TRX pour affichage dans l'onglet Tests
      - name: Publication des résultats de tests
        uses: actions/upload-artifact@v4
        if: always()  # Publie même en cas d'échec pour diagnostic
        with:
          name: unit-test-results
          path: |
            ./TestResults/Unit/**/*.trx
            ./TestResults/Unit/**/coverage.cobertura.xml
            ./TestResults/Unit/CoverageReport/
          retention-days: 7

      # Affichage du rapport de couverture dans le résumé du job
      - name: Affichage du résumé de couverture
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "./TestResults/Unit/**/coverage.cobertura.xml"
          badge: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: "60 80"  # Seuil warning : 60%, Seuil erreur : 80%

  # ===========================================================================
  # JOB 3 — TESTS D'INTÉGRATION
  # Exécute les tests d'intégration avec WebApplicationFactory + InMemory DB
  # ===========================================================================
  test-integration:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    needs: build  # Attend la réussite du build

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Installation du SDK .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Mise en cache des packages NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restauration des dépendances NuGet
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # Les tests d'intégration utilisent WebApplicationFactory + EF InMemory
      # Pas besoin de SQL Server — la base InMemory est configurée dans
      # CustomWebApplicationFactory (voir AssetFlowCore.IntegrationTests)
      - name: Exécution des tests d'intégration
        run: |
          dotnet test AssetFlowCore.IntegrationTests/AssetFlowCore.IntegrationTests.csproj \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-restore \
            --logger "trx;LogFileName=integration-tests-results.trx" \
            --results-directory ./TestResults/Integration \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
        env:
          # Variables d'environnement pour les tests d'intégration
          ASPNETCORE_ENVIRONMENT: Testing

      # Publication des résultats pour diagnostic en cas d'échec
      - name: Publication des résultats des tests d'intégration
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            ./TestResults/Integration/**/*.trx
            ./TestResults/Integration/**/coverage.cobertura.xml
          retention-days: 7

  # ===========================================================================
  # JOB 4 — BENCHMARKS
  # Exécute les benchmarks BenchmarkDotNet en mode Release
  # Les résultats sont publiés comme artefacts pour comparaison historique
  # ===========================================================================
  benchmark:
    name: Benchmarks de performance
    runs-on: ubuntu-latest
    needs: build  # Attend la réussite du build

    # Les benchmarks sont longs — timeout à 60 minutes
    timeout-minutes: 60

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Installation du SDK .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Mise en cache des packages NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restauration des dépendances NuGet
        run: dotnet restore AssetFlowCore.Benchmarks/AssetFlowCore.Benchmarks.csproj

      # Exécution des benchmarks en Release (obligatoire pour BenchmarkDotNet)
      # --filter '*' : lance tous les benchmarks
      # --exporters json,html : génère les rapports d'export
      # Les résultats sont écrits dans BenchmarkDotNet.Artifacts/
      - name: Exécution des benchmarks (Release uniquement)
        run: |
          dotnet run \
            --project AssetFlowCore.Benchmarks/AssetFlowCore.Benchmarks.csproj \
            --configuration Release \
            -- \
            --filter '*' \
            --exporters json html markdown \
            --artifacts ./BenchmarkResults
        env:
          DOTNET_ENVIRONMENT: Production

      # Publication des rapports de benchmark comme artefacts
      # Permet la comparaison entre les runs pour détecter les régressions
      - name: Publication des rapports de benchmark
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.sha }}
          path: ./BenchmarkResults/
          retention-days: 30  # Conservation 30 jours pour comparaison historique

      # Résumé des benchmarks dans le rapport du job
      - name: Résumé des résultats de benchmark
        if: always()
        run: |
          echo "## Résultats des Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ./BenchmarkResults/results/*-report.md ]; then
            cat ./BenchmarkResults/results/*-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "Aucun rapport Markdown généré." >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # JOB 5 — QUALITÉ DU CODE
  # Analyse statique SonarCloud + vérification du format
  # Dépend des deux jobs de tests pour consolider la couverture
  # ===========================================================================
  quality:
    name: Analyse qualité (SonarCloud)
    runs-on: ubuntu-latest
    environment: dev
    needs: [test-unit, test-integration]  # Requiert les deux rapports de couverture
    
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historique complet requis pour SonarCloud (blame, annotations)

      - name: Installation du SDK .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Mise en cache des packages NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Installation de Java (requis par le scanner SonarCloud)
      - name: Installation de Java 17 (requis par SonarCloud)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installation du scanner SonarCloud pour .NET
      - name: Installation de SonarCloud Scanner
        run: dotnet tool install --global dotnet-sonarscanner

      # Récupération des rapports de couverture générés par les jobs de tests
      - name: Récupération des rapports de couverture (tests unitaires)
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: ./TestResults/Unit

      - name: Récupération des rapports de couverture (tests d'intégration)
        uses: actions/download-artifact@v4
        with:
          name: integration-test-results
          path: ./TestResults/Integration

      - name: Restauration des dépendances NuGet
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # Démarrage de l'analyse SonarCloud
      # Les secrets SONAR_TOKEN et SONAR_ORGANIZATION doivent être configurés
      # dans Settings → Secrets → Actions du dépôt GitHub
      - name: Démarrage de l'analyse SonarCloud
        run: |
          dotnet sonarscanner begin \
            /k:"${{ secrets.SONAR_PROJECT_KEY }}" \
            /o:"${{ secrets.SONAR_ORGANIZATION }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="./TestResults/Unit/**/coverage.cobertura.xml,./TestResults/Integration/**/coverage.cobertura.xml" \
            /d:sonar.cs.vstest.reportsPaths="./TestResults/**/*.trx" \
            /d:sonar.coverage.exclusions="**/*.Tests/**,**/*.Benchmarks/**,**/Migrations/**,**/Program.cs" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/Migrations/**" \
            /d:sonar.qualitygate.wait=true

      # Compilation pour que SonarCloud collecte les métriques
      - name: Compilation pour analyse SonarCloud
        run: |
          dotnet build ${{ env.SOLUTION_FILE }} \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-restore

      # Fin et envoi des résultats à SonarCloud
      - name: Envoi des résultats à SonarCloud
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # ===========================================================================
  # JOB 6 — DÉPLOIEMENT
  # Build Docker + push vers GitHub Container Registry (GHCR)
  # Conditionnel : uniquement sur la branche main après réussite de quality
  # ===========================================================================
  deploy:
    name: Déploiement
    runs-on: ubuntu-latest
    needs: quality  # Attend la réussite de l'analyse qualité

    # Condition stricte : uniquement sur push vers main (pas les PR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Environnement GitHub (optionnel — active les approbations manuelles)
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/pkgs/container/assetflow-api

    permissions:
      contents: read
      packages: write  # Requis pour pousser vers GHCR

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      # Extraction des métadonnées Docker (tags, labels)
      # Génère automatiquement les tags : latest, sha-xxxxxxx, v1.0.0 (si tag git)
      - name: Extraction des métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Authentification sur GitHub Container Registry
      - name: Connexion à GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # Token automatique GitHub Actions

      # Activation de Docker Buildx pour le cache et le multi-platform
      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build et push de l'image Docker multi-stage
      # Cache activé pour accélérer les builds suivants (GitHub Actions cache)
      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha            # Utilise le cache GitHub Actions
          cache-to: type=gha,mode=max     # Sauvegarde le cache pour les prochains runs
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      # Résumé du déploiement dans le rapport du job
      - name: Résumé du déploiement
        run: |
          echo "## Déploiement réussi" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Propriété | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branche | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Déclenché par | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY