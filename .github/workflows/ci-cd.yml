# =============================================================================
# AssetFlowCore — Pipeline CI/CD GitHub Actions
# =============================================================================
# Déclencheurs :
#   - Push sur les branches main et dev
#   - Pull Request ciblant main ou dev
#
# Jobs :
#   1. build             → Compilation Release + vérification du format
#   2. test-architecture → Validation des règles d'architecture (dépend : build)
#   3. test-unit         → Tests unitaires + couverture de code (dépend : build)
#   4. test-integration  → Tests d'intégration (dépend : build)
#   5. benchmark         → Exécution des benchmarks BenchmarkDotNet (dépend : build)
#   6. quality           → Analyse SonarCloud (dépend : test-unit, test-integration)
#   7. deploy            → Déploiement Docker conditionnel sur main (dépend : quality)
# =============================================================================

name: AssetFlowCore CI/CD

# -----------------------------------------------------------------------------
# Déclencheurs du pipeline
# -----------------------------------------------------------------------------
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

# -----------------------------------------------------------------------------
# Variables d'environnement globales partagées par tous les jobs
# -----------------------------------------------------------------------------
env:
  DOTNET_VERSION: "8.0"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_FILE: "AssetFlowCore.slnx"
  BUILD_CONFIGURATION: "Release"
  DOCKER_IMAGE_NAME: "assetflow-api"

# =============================================================================
# JOB 1 — BUILD
# =============================================================================
jobs:
  build:
    name: Build & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installation du SDK .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Mise en cache des packages NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restauration des dépendances NuGet
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Compilation en mode Release
        run: |
          dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Vérification du format du code (dotnet format)
        run: |
          dotnet format ${{ env.SOLUTION_FILE }} \
            --verify-no-changes \
            --no-restore \
            --severity warn
        continue-on-error: false

      - name: Publication des artefacts de build
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/bin/Release/
            **/obj/Release/
          retention-days: 1

  # ===========================================================================
  # NEW JOB — TESTS D'ARCHITECTURE (ArchUnitNET)
  # ===========================================================================
  test-architecture:
    name: Tests d'architecture
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Installation du SDK .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Mise en cache des packages NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restauration des dépendances NuGet
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # Exécution ciblée des tests d'architecture avec couverture OpenCover
      - name: Exécution des tests d'architecture
        run: |
          dotnet test AssetFlowCore.ArchitectureTests/AssetFlowCore.ArchitectureTests.csproj \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-restore \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage-architecture \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Upload du rapport de couverture d'architecture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-architecture
          path: ./coverage-architecture/**/coverage.opencover.xml
          retention-days: 1

  # ===========================================================================
  # JOB 2 — TESTS UNITAIRES
  # ✅ CORRIGÉ : génération du rapport de couverture OpenCover + upload artefact
  # ===========================================================================
  test-unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: test-architecture

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Installation du SDK .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Mise en cache des packages NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restauration des dépendances NuGet
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # ✅ Collecte de couverture au format OpenCover (requis par SonarCloud)
      - name: Exécution des tests unitaires avec couverture
        run: |
          dotnet test AssetFlowCore.UnitTests/AssetFlowCore.UnitTests.csproj \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-restore \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage-unit \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      # ✅ Upload du rapport pour le job quality
      - name: Upload du rapport de couverture unitaire
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: ./coverage-unit/**/coverage.opencover.xml
          retention-days: 1

  # ===========================================================================
  # JOB 3 — TESTS D'INTÉGRATION
  # ✅ CORRIGÉ : génération du rapport de couverture OpenCover + upload artefact
  # ===========================================================================
  test-integration:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    needs: test-architecture

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Installation du SDK .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Mise en cache des packages NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restauration des dépendances NuGet
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # ✅ Collecte de couverture au format OpenCover (requis par SonarCloud)
      - name: Exécution des tests d'intégration avec couverture
        run: |
          dotnet test AssetFlowCore.IntegrationTests/AssetFlowCore.IntegrationTests.csproj \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-restore \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage-integration \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        env:
          ASPNETCORE_ENVIRONMENT: Testing

      # ✅ Upload du rapport pour le job quality
      - name: Upload du rapport de couverture d'intégration
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: ./coverage-integration/**/coverage.opencover.xml
          retention-days: 1

  # ===========================================================================
  # JOB 4 — BENCHMARKS
  # ===========================================================================
  benchmark:
    name: Benchmarks de performance
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Installation du SDK .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Mise en cache des packages NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restauration des dépendances NuGet
        run: dotnet restore AssetFlowCore.Benchmarks/AssetFlowCore.Benchmarks.csproj

      - name: Exécution des benchmarks (Release uniquement)
        run: |
          dotnet run \
            --project AssetFlowCore.Benchmarks/AssetFlowCore.Benchmarks.csproj \
            --configuration Release \
            -- \
            --filter '*' \
            --exporters json html markdown \
            --artifacts ./BenchmarkResults
        env:
          DOTNET_ENVIRONMENT: Production

      - name: Publication des rapports de benchmark
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.sha }}
          path: ./BenchmarkResults/
          retention-days: 30

      - name: Résumé des résultats de benchmark
        if: always()
        run: |
          echo "## Résultats des Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ./BenchmarkResults/results/*-report.md ]; then
            cat ./BenchmarkResults/results/*-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "Aucun rapport Markdown généré." >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # JOB 5 — QUALITÉ DU CODE
  # ✅ CORRIGÉ : téléchargement des rapports de couverture + transmission à Sonar
  # ===========================================================================
  quality:
    name: Analyse qualité (SonarCloud)
    runs-on: ubuntu-latest
    environment: dev
    needs: [test-unit, test-integration, test-architecture]

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installation du SDK .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Mise en cache des packages NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Installation de Java 17 (requis par SonarCloud)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installation de SonarCloud Scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restauration des dépendances NuGet
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # Téléchargement des deux rapports de couverture uploadés par test-unit et test-integration
      - name: Téléchargement des rapports de couverture
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: ./coverage

      # Prise en compte globale des 3 rapports OpenCover par Sonar
      - name: Démarrage de l'analyse SonarCloud
        run: |
          dotnet sonarscanner begin \
            /k:"${{ secrets.SONAR_PROJECT_KEY }}" \
            /o:"${{ secrets.SONAR_ORGANIZATION }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="./coverage/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/*.Tests/**,**/*.Benchmarks/**,**/Migrations/**,**/Program.cs" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/Migrations/**" \
            /d:sonar.qualitygate.wait=true

      - name: Compilation pour analyse SonarCloud
        run: |
          dotnet build ${{ env.SOLUTION_FILE }} \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-restore

      # Fin et envoi des résultats à SonarCloud
      - name: Envoi des résultats à SonarCloud 
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # ===========================================================================
  # JOB 6 — DÉPLOIEMENT
  # ===========================================================================
  deploy:
    name: Déploiement
    runs-on: ubuntu-latest
    needs: quality

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://github.com/${{ github.repository }}/pkgs/container/assetflow-api

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Extraction des métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Connexion à GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Résumé du déploiement
        run: |
          echo "## Déploiement réussi" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Propriété | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branche | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Déclenché par | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY